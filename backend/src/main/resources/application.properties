# ===================================================================
# DeepSpring AI - Application Configuration
# Tagline: Private AI chat, running on your own machine.
# ===================================================================

spring.application.name=DeepSpring AI
server.port=${BACKEND_PORT:8080}

# AI Provider Selection: 'mock' (default, test/offline mode) or 'ollama' (live local inference)
app.ai.provider=${AI_PROVIDER:mock}

# CORS Configuration (comma-separated list of allowed origins)
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

# Mock Provider Settings
app.mock.stream-delay-millis=${MOCK_STREAM_DELAY:25}
app.mock.simulate-thinking=true

# Spring AI - Ollama Configuration
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.options.model=${OLLAMA_MODEL:deepseek-r1}
spring.ai.ollama.chat.options.temperature=0.7

# Logging Configuration
logging.level.root=INFO
logging.level.com.deepspring.ai=INFO
logging.level.org.springframework.ai=INFO
logging.level.org.springframework.web=INFO
